block.ld-Mech-constructor.name = Конструктор шатальщиков

block.ld-Mech-constructor.description = Производит шатальщиков. Вывод единиц может быть осуществлён напрямую, либо направлен в реконструкторы.

block.ld-Mech-constructor.details = Это же мехи?..


block.ld-Hover-constructor.name = Конструктор витающих

