## objectives

## units

unit.ld-indignation-unit.name = Отвращение

unit.ld-indignation-unit.description = Стреляет очередями заряженного пирита. Умеет строить и копать в том числе. Защищает ядро "Возмущение".



unit.ld-Exsabil.name = Экзобил

unit.ld-Exsabil.description = Использует пару небольших пушек которые стреляют заряженными ракетами, чтобы нанести ущерб врагу. Очень быстрый, может парить над жидкостями.

unit.ld-Meglit.name = Мегалит

unit.ld-Meglit.description = Стреляет скоростными крюками по врам притягивая их, пули распадаются на маленькие осколки.

unit.ld-Corba.name = Кобра

unit.ld-Corba.description = Оснащен одним пробивным пулеметом. Может переступать через большую часть метсности.

unit.ld-Emplitide.name = Эмплидуда

unit.ld-Emplitide.description = Оснащен четырьмя маленькими пушками и дальнобойной артиллерийской бомбардой. Не амплитуда а эмплидуда. Очень быстрый, может парить над жидкостями.

unit.ld-Ateit.name = Атэит

unit.ld-Ateit.description = Стреляет ещё более скоростными крюками по врам притягивая их, пули распадаются на меньшие самонаводящиеся осколки которые тоже потом рападаются.


## turrets

block.ld-exhaustion.name = Истощение

block.ld-exhaustion.description = Стреляет пронзающей звездой средней дальности, которая распадается на молнии и осколки. Снаряд скачет между врагами досмерти.

block.ld-exhaustion.details = Это очень серьезное оружие, несмотря на то, что это первая версия, разработанная с использованием плазменно-вакуумной технологии.

block.ld-Irrefutability.name = Неопровержение

block.ld-Irrefutability.description = Точно неопровержимо, уничтожает орды врагов прошивающей шрапнелью с большого расстояния.

block.ld-overthrow.name = Свержение

block.ld-overthrow.description = Пулемёт, и чё?

block.ld-overthrow.details = ничё блять.

block.ld-retribution.name = Разламывание

block.ld-retribution.description = Разламывает врагов своей очередью скоростных прошивающих намагниченых снарядов которые кружат вокруг своего бароцентра.

block.ld-retribution.details = Первая версия, разработанная с использованием намагничевающей технологии. Сама [red]КОСОЁБОСТЬ[darkgray].


## factories

block.ld-Dual-furnance.name = Двойная печь

block.ld-Dual-furnance.description = Синтезирует родий из пирита и индия.

block.ld-methane-heater.name = Метановый нагреватель

block.ld-methane-heater.description = Нагревает все постройки вокруг себя на 2 ед. используя небольшое кол-во метана.

block.ld-indium-melter.name = Индиевая плавильня

block.ld-indium-melter.description = Плавит индий испльзуя большое кол-во тепла.

block.ld-burner-compressor.name = Паровой супрессор

block.ld-burner-compressor.description = Супрессирует горючие пары галлия в куске палладия для создания пирофита.

block.ld-oxygen-mixer.name = Кислородный фильтр

block.ld-oxygen-mixer.description = Пропускает сквозь галлий атмосферу планеты выделяя кислород из неё. Требует тепло для работы.


