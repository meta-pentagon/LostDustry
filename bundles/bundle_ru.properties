## drils

block.ld-kinetic-drill.name = Кинетический бур

block.ld-kinetic-drill.description = Использует кинетическую энергию для бурения.

block.ld-liquid-crusher.name = Индиевый дроюитель

block.ld-liquid-crusher.description = Дробит индий из стен.

block.ld-methane-concentrator.name = Метановый концентратор

block.ld-methane-concentrator.description = Концетрирует метан из жерл и генерирует хорошее кол-во энергии.


## Misc

block.ld-indignation-core.name = Ядро: «Возмущение»

block.ld-indignation-core.description = Стартовое ядро на Аутизме. Бронировано. После уничтожения весь контакт с регионом теряется.

block.ld-indignation-core.details = Брдыщ...

block.ld-repair-tower.name = Чинило

block.ld-repair-tower.description = Чинит построки вокруг используя галлий, может чинить только 5 построек за раз, но очень эффективно.

## transport

block.ld-PaladiumRouter.name = Палладиевый маршрутизатор

block.ld-PaladiumRouter.description = Равномерно распределяет входящие предметы по 3 выходящим направлениям. Сделан из палладия.

block.ld-PaladiumRouter.details = Великое зло добралось и до ледяного спутника… Однажды оно покорит всю вселенную.

block.ld-PaladiumInvertedSorter.name = Палладиевый инвертированный сортировщик

block.ld-PaladiumInvertedSorter.description = Работает так же, как и стандартный сортировщик, но выводит выбранный предмет по бокам, а не прямо. Сделан из палладия.

block.ld-PaladiumSorter.name = Палладиевый сортировщик

block.ld-PaladiumSorter.description = Если входящий предмет совпадает с выбором, то он проходит вперёд, иначе предмет выводится по бокам. Сделан из палладия.

block.ld-PaladiumConveyor.name = Палладиевый конвейер

block.ld-PaladiumConveyor.description = Конвейер из палладия, намного быстрее оригинала.

block.ld-PaladiumUnloader.name = Палладиевый разгрузчик

block.ld-PaladiumUnloader.description = Разгрузчик из палладия.

block.ld-PaladiumJunction.name = Палладиевый перекрёсток

block.ld-PaladiumJunction.description = Позволяет безболезненно пересекать конвейеры без смешивания ресурсов. Сделан из палладия.

block.ld-PaladiumOverflowGate.name = Палладиевый избыточный затвор

block.ld-PaladiumOverflowGate.description = Выводит предметы по бокам, только если передний путь заблокирован. Сделан из палладия.

block.ld-PaladiumBridge.name = Палладиевый мост

block.ld-PaladiumBridge.description = Перемещает предметы над местностью или зданиями. Сделан из палладия.

block.ld-PaladiumUnderflowGate.name = Палладиевый избыточный шлюз

block.ld-PaladiumUnderflowGate.description = Противоположность избыточного затвора. Выводит предметы вперёд, только если боковые пути заблокированы. Сделан из палладия.

block.ld-PaladiumConduitRouter.name = Палладиевый жидкостный маршрутизатор

block.ld-PaladiumConduitRouter.description = Распределяет жидкости во всех направлениях.

block.ld-PaladiumConduitJunction.name = Палладиевый жидкостный перекрёсток

block.ld-PaladiumConduitJunction.description = Позволяет двум трубам пересекаться не смешивая жидкости.

block.ld-PaladiumConduitBridge.name = Палладиевый жидкостный мост

block.ld-PaladiumConduitBridge.description = Транспортирует жидкости через скалы ил постройки. Конечный элемент цепи распределяет жидкости в трёх направлениях.

block.ld-PaladiumConduit.name = Палладиевый трубопровод

block.ld-PaladiumConduit.description = Транспортирует жидкости.

block.ld-fast-pump.name = Кинетическая помпа

block.ld-fast-pump.description = Использует кинетическую энергию для выкачки жидкостей.

block.ld-heat-tube.name = Тепловая труба

block.ld-heat-tube.description = Перенаправляет тепло.


## walls

block.ld-flamatite-wall.name = Пирофитовая стена

block.ld-flamatite-wall.description = Прочная смесь пирофита и пирита. Поглощает лазеры и электрические разряды.

block.ld-paladium-wall.name = Палладиевая стена

block.ld-paladium-wall.description = Палладиевая стена блять, и всё!


## power

block.ld-pyrite-node.name = Пиритовый кабель

block.ld-pyrite-node.description = Транспортирует энергию хранит очень маленькое кол-во энергии.

block.ld-under-burn-emgine.name = Двигатель внутренего сгорания

block.ld-under-burn-emgine.description = Генерирует огромное количество энергии из пирофита и жидкого индия выделяя дополнительное тепло в одну сторону.

block.ld-under-burn-emgine.details = Как ОНО работает в чистый плюс?


